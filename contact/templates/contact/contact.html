      
{% extends "base.html" %}

{% block title %}Contact Us {% endblock %}

{% load static %}
{% block body %}



      
      <div class="container">
            <div class="site-banner">
                <div class="header-menu">
                    <a href="">Logo</a> 
                    <span id="menu-icon" onClick="toggleMenu()"><img src="assets/images/about-banner.png" /></span>
                 
                </div>
                <h1 class="heading">Contact Us</h1>
            </div>
            <div class="footer">
                <div class="footer-column"><img class="map-image" src="assets/images/image.png" /></div>
                <div class="footer-column">
                    <div class="tile-content">
                        <h1>Meet Us</h1>
                        <div class="contact-row">
                            <img src=""><span class="tile-field">+466723723666</span>
                        </div>
                        <div class="contact-row">
                            <img src=""><span class="tile-field">contact@admin.com</span>
                        </div>
                        <div class="contact-row">
                            <img src=""><span class="tile-field">4th St. 6th of October City, giza, Egypt</span>
                        </div>
                    </div>
                </div>
                <div class="footer-column contact-form-container">
                    <div class="tile-content">
                        <form method="POST">
                            <h1>Contact</h1>
                            <div class="contact-row">
                                <input type="text" class="form-field" placeholder="Name">
                            </div>
                            <div class="contact-row">
                                <textarea rows="5" class="form-field" placeholder="Message"></textarea>
                            </div>
                            <button class="button">Send</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

{% endblock body %}
